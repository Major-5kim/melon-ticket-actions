name: Ticket Watcher

on:
  schedule:
    - cron: '*/5 * * * *'  # 매 5분마다 실행

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Check Tickets
        uses: mooyoul/melon-ticket-actions@v1.1.0
        with:
          product-id: 211408      # 211408
          schedule-id: 100003     # 100003
          slack-incoming-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          message: '🎟️ 좌석이 생겼어요! <@U12345678>'  # 슬랙 멘션
